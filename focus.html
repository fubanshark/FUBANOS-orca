<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07152E">
    <script src="js/theme.js?v=theme-migration-2ad5aaf"></script>

    <title>Focus | FUBAN OS</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/pages/focus.css">
    <link rel="stylesheet" href="css/theme.css?v=theme-migration-2ad5aaf">
</head>

<body id="focus-page">

    <!-- =====================================
         BACKGROUND
    ====================================== -->

    <div class="focus-wallpaper"></div>
    <div class="focus-wallpaper-overlay"></div>


    <!-- =====================================
         NAVIGATION
    ====================================== -->

    <header class="focus-header">

        <nav class="focus-navigation">

            <a href="dashboard.html" class="focus-nav-link">
                Dashboard
            </a>

            <a href="focus.html" class="focus-nav-link active">
                Focus
            </a>

            <a href="garden.html" class="focus-nav-link">
                Garden
            </a>

            <a href="milestone.html" class="focus-nav-link">
                Milestone
            </a>

        </nav>

    </header>


    <!-- =====================================
         WALLPAPER CONTROL
    ====================================== -->

    <button
        type="button"
        id="focus-wallpaper-open"
        class="focus-wallpaper-button"
        aria-label="Change Focus wallpaper"
        title="Change Wallpaper"
    >

        <svg viewBox="0 0 24 24" aria-hidden="true">

            <rect
                x="3"
                y="4"
                width="18"
                height="16"
                rx="2"
            ></rect>

            <circle
                cx="8.5"
                cy="9"
                r="1.5"
            ></circle>

            <path d="M3 16l5-5 4 4 3-3 6 6"></path>

        </svg>

    </button>


    <!-- =====================================
         MAIN CLOCK
    ====================================== -->

    <!-- =====================================
     MAIN FOCUS
===================================== -->

<main class="focus-main">

    <section class="focus-clock-section">

        <!-- Real-time Clock -->

        <div
            id="focus-clock"
            class="focus-clock"
        >
            00.00.00
        </div>


        <!-- Start Time -->

        <p
            id="focus-start-time"
            class="focus-start-time"
        >
            Ready to focus
        </p>


        <!-- Elapsed Time -->

        <p
            id="focus-duration"
            class="focus-duration"
            hidden
        >
            Focus duration 00:00:00
        </p>

        <button
            type="button"
            id="focus-xp-toggle"
            class="focus-xp-toggle"
            aria-controls="focus-xp-details"
            aria-pressed="true"
        >
            Hide XP
        </button>

        <div id="focus-xp-details" class="focus-xp-details">
            <p id="focus-xp-total" class="focus-xp-total">
                Total XP: 0
            </p>

            <p class="focus-xp-hint">
                Earn 1 XP per full minute after a 10-minute session (maximum 50 XP).
            </p>

            <p
                id="focus-xp-session-result"
                class="focus-xp-session-result"
                hidden
            ></p>
        </div>


        <!-- Focus Controls -->

        <div class="focus-controls">

            <button
                type="button"
                id="focus-start-button"
                class="focus-control-button start"
            >
                Start Focus
            </button>

            <button
                type="button"
                id="focus-stop-button"
                class="focus-control-button stop"
                disabled
            >
                Stop Focus
            </button>

        </div>

    </section>

</main>


    <!-- =====================================
         WALLPAPER MODAL
    ====================================== -->

    <div
        id="focus-wallpaper-modal"
        class="focus-modal"
        aria-hidden="true"
    >

        <div
            class="focus-modal-box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="focus-wallpaper-title"
        >

            <button
                type="button"
                class="focus-modal-close"
                data-close="focus-wallpaper-modal"
                aria-label="Close"
            >
                
            </button>


            <h2 id="focus-wallpaper-title">
                Focus Wallpaper
            </h2>

            <p class="focus-modal-description">
                Customize your Focus background.
            </p>


            <!-- Built-in wallpaper -->
<div class="focus-wallpaper-options">

    <button type="button" class="focus-wallpaper-option selected"
        data-wallpaper="assets/wallpapers/orca.jpg">
        <img src="assets/wallpapers/orca.jpg" alt="Orca wallpaper">
        <span>Orca</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/euplectella.jpg">
        <img src="assets/wallpapers/euplectella.jpg" alt="Euplectella wallpaper">
        <span>Euplectella</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/seaangle.jpg">
        <img src="assets/wallpapers/seaangle.jpg" alt="Sea Angel wallpaper">
        <span>Sea Angel</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/moonjelly.jpg">
        <img src="assets/wallpapers/moonjelly.jpg" alt="Moon Jelly wallpaper">
        <span>Moon Jelly</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/abyss.jpg">
        <img src="assets/wallpapers/abyss.jpg" alt="Abyss wallpaper">
        <span>Abyss</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/reze.jpg">
        <img src="assets/wallpapers/reze.jpg" alt="Reze wallpaper">
        <span>Reze</span>
    </button>

    <button type="button" class="focus-wallpaper-option"
        data-wallpaper="assets/wallpapers/greatblue.jpg">
        <img src="assets/wallpapers/greatblue.jpg" alt="Great Blue Whale wallpaper">
        <span>Great Blue</span>
    </button>

</div>


            <!-- Upload -->

            <label
                for="focus-wallpaper-upload"
                class="focus-upload-label"
            >
                <span>＋ Upload your own wallpaper</span>

                <input
                    type="file"
                    id="focus-wallpaper-upload"
                    accept="image/png,image/jpeg,image/webp"
                >

            </label>


            <!-- Darkness -->

            <div class="focus-darkness-control">

                <div class="focus-darkness-heading">

                    <label for="focus-wallpaper-opacity">
                        Wallpaper darkness
                    </label>

                    <span id="focus-wallpaper-opacity-value">
                        18%
                    </span>

                </div>

                <input
                    type="range"
                    id="focus-wallpaper-opacity"
                    min="0"
                    max="85"
                    value="18"
                >

            </div>


            <!-- Save -->

            <button
                type="button"
                id="focus-wallpaper-save"
                class="focus-modal-submit"
            >
                Save Wallpaper
            </button>

        </div>

    </div>


    <!-- =====================================
         SCRIPTS
    ====================================== -->

    <script src="js/main.js"></script>
    <script src="js/xp.js"></script>
    <script src="js/system-achievements.js"></script>
    <script src="js/pages/focus.js"></script>

</body>

</html>
